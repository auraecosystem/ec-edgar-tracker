name: Fetch Daily SEC Filings

on:
  schedule:
    # Runs at 20:00 UTC (4 PM EST) every Monday through Friday when the SEC is active
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger the script anytime via GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-state-file: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: Run SEC Scraper
      run: python fetch_filing.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "sec-bot"
        git config --global user.email "bot@example.com"
        git add .
        # Only commit if there are actually changes to prevent workflow errors
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated SEC Data Update [skip ci]"
        git push
